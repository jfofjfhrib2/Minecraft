
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no">

    <title>BlockWorld</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="menu">
        <div class="panel">
            <h1 class="logo">BLOCKWORLD</h1>

            <p>
                Eine eigene 3D-Blockwelt mit Wasser,
                Lava, Bäumen und vielen Blöcken.
            </p>

            <button id="newGame"
                    class="menu-button">
                NEUE WELT
            </button>

            <button id="loadGame"
                    class="menu-button secondary">
                WELT LADEN
            </button>

            <p>
                Auf dem gesamten Bildschirm wischen,
                um dich umzusehen.
            </p>
        </div>
    </div>

    <div id="hud">
        <div id="crosshair"></div>

        <div id="stats">
            FPS: <span id="fps">0</span><br>
            HP: <span id="hp">20</span><br>
            XYZ: <span id="xyz">0 / 0 / 0</span>
        </div>

        <div id="help">
            WASD = LAUFEN<br>
            LEERTASTE = SPRINGEN<br>
            LINKSKLICK = ABBAUEN<br>
            RECHTSKLICK = PLATZIEREN<br>
            E = INVENTAR
        </div>

        <div id="selectedName"></div>
        <div id="hotbar"></div>
    </div>

    <div id="pause">
        <div class="panel">
            <h2>PAUSE</h2>

            <button id="resume"
                    class="action-button">
                WEITERSPIELEN
            </button>

            <button id="save"
                    class="action-button secondary">
                SPEICHERN
            </button>

            <button id="goMenu"
                    class="action-button secondary">
                HAUPTMENÜ
            </button>
        </div>
    </div>

    <div id="inventory">
        <div class="panel">
            <h2>INVENTAR</h2>

            <div id="inventoryGrid"
                 class="inventory-grid">
            </div>

            <button id="closeInventory"
                    class="action-button secondary">
                SCHLIESSEN
            </button>
        </div>
    </div>

    <div id="touch">
        <button id="forward"
                class="touch-button">▲</button>

        <button id="left"
                class="touch-button">◀</button>

        <button id="back"
                class="touch-button">▼</button>

        <button id="right"
                class="touch-button">▶</button>

        <button id="jump"
                class="touch-button">⤒</button>

        <button id="break"
                class="touch-button">⛏</button>

        <button id="place"
                class="touch-button">＋</button>

        <button id="invButton"
                class="touch-button">▦</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
